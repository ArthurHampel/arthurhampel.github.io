<script src="site.js"></script>
<script>
// ARROW: a small game about aim.
function initArrowGame() {
  const canvas = document.getElementById('range');
  if (!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready = '1';
  const ctx = canvas.getContext('2d');
  const col = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let W, H;
  function size() {
    const DPR = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  size(); window.addEventListener('resize', size);

  const bow = () => ({ x: 60, y: H - 60 });
  const target = () => ({ x: W - 74, y: 100, r: Math.min(44, W * .09), dot: 13 });

  let start = null, drag = null, flight = null;
  const stuck = [];
  const rootS = document.documentElement.style; // the shared dot color lives on the root
  const ALL = ['#3E6B5A', '#7A4A24', '#A6803A', '#8B3A3A', '#3A5A8B', '#6B4A8B'];
  const dotColor = () => rootS.getPropertyValue('--dot').trim();
  function cycleDot() {
    const i = ALL.indexOf(dotColor());
    const next = i < 0 ? ALL[0] : ALL[(i + 1) % ALL.length];
    rootS.setProperty('--dot', next); // every dot and header reads this
    try { localStorage.setItem('dot-color', next); } catch (e) {}
    return next;
  }
  const K = 8, PULL = 80, G = 620; // short draw: power is capped, so you have to loft it

  canvas.addEventListener('pointerdown', e => {
    if (flight) return;
    const r = canvas.getBoundingClientRect();
    start = drag = { x: e.clientX - r.left, y: e.clientY - r.top };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!start) return;
    const r = canvas.getBoundingClientRect();
    drag = { x: e.clientX - r.left, y: e.clientY - r.top };
  });
  // hovering the target in the range also cycles the color, like the one up top
  let overTarget = false;
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    const t = target();
    const over = Math.hypot(e.clientX - r.left - t.x, e.clientY - r.top - t.y) < t.r;
    if (over && !overTarget) cycleDot();
    overTarget = over;
  });
  canvas.addEventListener('pointerup', () => {
    if (!start) return;
    let dx = start.x - drag.x, dy = start.y - drag.y;
    const len = Math.hypot(dx, dy);
    if (len > 12) {
      const cap = Math.min(len, PULL) / len; // the draw maxes out; pulling further adds nothing
      dx *= cap; dy *= cap;
      const b = bow();
      flight = { x: b.x, y: b.y, vx: dx * K, vy: dy * K };
    }
    start = drag = null;
  });



  function drawArrow(x1, y1, x2, y2, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 9 * Math.cos(a - .4), y2 - 9 * Math.sin(a - .4));
    ctx.lineTo(x2 - 9 * Math.cos(a + .4), y2 - 9 * Math.sin(a + .4));
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 1.4;
    for (const off of [.5, -.5]) {
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - 8 * Math.cos(a - off), y1 - 8 * Math.sin(a - off)); ctx.stroke();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .033); last = now;
    if (flight) {
      flight.vy += G * dt;
      flight.x += flight.vx * dt;
      flight.y += flight.vy * dt;
      const t = target();
      const d = Math.hypot(flight.x - t.x, flight.y - t.y);
      if (d < t.dot) {
        // the point itself: the color changes with every hit, here and in the site's own target
        const next = cycleDot();
        stuck.push({ x: flight.x, y: flight.y, a: Math.atan2(flight.vy, flight.vx), color: next });
        flight = null;
      } else if (flight.x > W + 60 || flight.y > H + 60 || flight.x < -60) {
        flight = null;
      }
    }

    ctx.clearRect(0, 0, W, H);
    const ink = col('--ink'), soft = col('--ink-soft'), accent = col('--accent');
    const t = target(), b = bow();

    // target
    ctx.lineWidth = 5; ctx.strokeStyle = ink;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.stroke();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const s = reduce ? 1 : 1 + .2 * Math.sin(now / 764);
    ctx.fillStyle = dotColor() || ink;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.dot * s, 0, 7); ctx.fill();

    // arrows stuck in the target
    for (const a of stuck)
      drawArrow(a.x - Math.cos(a.a) * 34, a.y - Math.sin(a.a) * 34, a.x, a.y, a.color || ink);

    // bow
    let ang = Math.atan2(t.y - b.y, t.x - b.x), pull = 0;
    if (start && drag) {
      ang = Math.atan2(start.y - drag.y, start.x - drag.x);
      pull = Math.min(Math.hypot(start.x - drag.x, start.y - drag.y), PULL);
    }
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang);
    ctx.strokeStyle = ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 26, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke();
    const tipX = Math.cos(Math.PI / 2.2) * 26, tipY = Math.sin(Math.PI / 2.2) * 26;
    const nock = -pull * .3;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tipX, -tipY); ctx.lineTo(nock, 0); ctx.lineTo(tipX, tipY); ctx.stroke();
    if (start) {
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(nock, 0); ctx.lineTo(nock + 44, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(nock + 44, 0); ctx.lineTo(nock + 36, -4); ctx.lineTo(nock + 36, 4);
      ctx.closePath(); ctx.fillStyle = ink; ctx.fill();
    }
    ctx.restore();

    // aim preview
    if (start && pull > 12) {
      let px = b.x, py = b.y;
      const pdx = start.x - drag.x, pdy = start.y - drag.y;
      const plen = Math.hypot(pdx, pdy), pcap = Math.min(plen, PULL) / plen;
      let pvx = pdx * pcap * K, pvy = pdy * pcap * K;
      ctx.fillStyle = soft;
      for (let i = 0; i < 5; i++) {
        pvy += G * .045; px += pvx * .045; py += pvy * .045;
        ctx.beginPath(); ctx.arc(px, py, 1.6, 0, 7); ctx.fill();
      }
    }

    // arrow in flight
    if (flight) {
      const a = Math.atan2(flight.vy, flight.vx);
      drawArrow(flight.x - Math.cos(a) * 34, flight.y - Math.sin(a) * 34, flight.x, flight.y, ink);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
initArrowGame();
</script>
</body>
</html>
